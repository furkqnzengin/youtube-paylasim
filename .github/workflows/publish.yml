name: YouTube Shorts paylas

on:
  schedule:
    # Saatler UTC. Turkiye saati = UTC + 3.
    - cron: "7 13 * * *"   # 16:07 TR
    - cron: "7 19 * * *"   # 22:07 TR
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Yuklemeden sadece siradakini goster"
        type: boolean
        default: false
      privacy:
        description: "Gizlilik"
        type: choice
        options: [public, unlisted, private]
        default: public

permissions:
  contents: write

concurrency:
  group: youtube-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Yukle
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.privacy || 'public' }}
        run: python scripts/upload.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Durumu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/published.json
          git diff --cached --quiet && exit 0
          git commit -m "Yayinlandi: $(python -c "import json;print(json.load(open('state/published.json'))[-1]['file'])")"
          git pull --rebase
          git push
